<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --accent: var(--color-click);
      --focus-y: 74%;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      background: transparent;
    }

    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #focus {
      position: absolute;
      left: 50%;
      top: var(--focus-y);
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%) scale(0.8);
      border-radius: var(--radius-pill);
      border: 2px solid transparent;
      background:
        linear-gradient(transparent, transparent) padding-box,
        linear-gradient(135deg, var(--accent), rgba(20, 50, 94, 0.12)) border-box;
      opacity: 0;
      transition: opacity 120ms var(--ease), transform 180ms var(--ease);
    }

    #focus::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 5px var(--accent);
    }

    #focus::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      border: 1px solid rgba(20, 50, 94, 0.14);
      opacity: 0;
    }

    #focus.pointer.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #focus.pointer.visible::after {
      animation: ring-pulse 420ms var(--ease) forwards;
    }

    #focus.done {
      background:
        linear-gradient(transparent, transparent) padding-box,
        linear-gradient(135deg, var(--color-done), rgba(20, 50, 94, 0.1)) border-box;
    }

    #focus.done::before {
      background: var(--color-done);
      box-shadow: 0 0 7px var(--color-done);
    }

    #focus.error {
      background:
        linear-gradient(transparent, transparent) padding-box,
        linear-gradient(135deg, var(--color-error), rgba(20, 50, 94, 0.1)) border-box;
    }

    #focus.error::before {
      background: var(--color-error);
      box-shadow: 0 0 7px var(--color-error);
    }

    #popup {
      position: absolute;
      left: 50%;
      top: auto;
      bottom: calc(100% - var(--focus-y) + 28px);
      transform: translate(-50%, 6px);
      min-width: 260px;
      max-width: 420px;
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr);
      align-items: center;
      column-gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      color: var(--text-primary);
      font-family: var(--font-ui);
      opacity: 0;
      box-shadow: var(--shadow-sm);
      transition:
        opacity 120ms var(--ease),
        transform 120ms var(--ease),
        border-color 120ms var(--ease),
        box-shadow 120ms var(--ease);
    }

    #popup.visible {
      opacity: 1;
      transform: translate(-50%, 0);
      box-shadow: var(--shadow-md);
    }

    #popup.hiding {
      opacity: 0;
      transform: translate(-50%, -4px);
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
    }

    #popup[data-action="click"],
    #popup[data-action="double"],
    #popup[data-action="right"],
    #popup[data-action="middle"] { --accent: var(--color-click); }

    #popup[data-action="type"] { --accent: var(--color-type); }
    #popup[data-action="key"] { --accent: var(--color-key); }
    #popup[data-action="scroll"] { --accent: var(--color-scroll); }
    #popup[data-action="drag"] { --accent: var(--color-drag); }
    #popup[data-action="move"] { --accent: var(--color-move); }

    #popup[data-status="done"] {
      --accent: var(--color-done);
      border-color: rgba(var(--color-done-rgb), 0.3);
    }

    #popup[data-status="error"] {
      --accent: var(--color-error);
      border-color: rgba(var(--color-error-rgb), 0.35);
    }

    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: var(--radius-pill);
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(20, 50, 94, 0.12);
      align-self: start;
      margin-top: 4px;
    }

    #popup[data-status="done"] #status-dot {
      box-shadow: 0 0 0 4px rgba(var(--color-done-rgb), 0.2);
    }

    #popup[data-status="error"] #status-dot {
      box-shadow: 0 0 0 4px rgba(var(--color-error-rgb), 0.2);
    }

    #icon {
      width: 15px;
      height: 15px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.92;
      align-self: start;
      margin-top: 1px;
    }

    #icon svg {
      width: 100%;
      height: 100%;
    }

    #copy {
      min-width: 0;
      display: grid;
      row-gap: 2px;
    }

    #title {
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    #detail {
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      word-break: break-word;
    }

    @keyframes ring-pulse {
      0% {
        opacity: 0.38;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.32);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #popup,
      #focus {
        transition: none;
      }

      #focus.pointer.visible::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="focus"></div>
    <div id="popup" data-status="start">
      <span id="status-dot"></span>
      <span id="icon"></span>
      <span id="copy">
        <span id="title">Action</span>
        <span id="detail">Running...</span>
      </span>
    </div>
  </div>
  <script src="tauri-bridge.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
