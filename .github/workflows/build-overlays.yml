name: build-overlays

# Overlay-only CI: compile the Tauri/Rust sidecar on all 5 platforms.
# Used by release.sh to obtain cross-compiled overlay binaries before
# running the main Bun packaging step locally.
#
# Artifacts are named overlay-<platform> and kept for 3 days.

on:
  workflow_dispatch:

jobs:
  build-overlay:
    name: overlay (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
            ext: ""
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          - runner: macos-latest
            platform: darwin-arm64
            ext: ""
          - runner: macos-15-intel
            platform: darwin-x64
            ext: ""
          - runner: windows-latest
            platform: windows-x64
            ext: ".exe"

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/overlay/src-tauri -> target

      - name: Build overlay
        run: cargo build --release --manifest-path packages/overlay/src-tauri/Cargo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-${{ matrix.platform }}
          path: packages/overlay/src-tauri/target/release/opencorvus-overlay${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 3
