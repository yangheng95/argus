name: build-overlays

# Manual debug workflow for overlay bundles only.
# Canonical release flow is .github/workflows/build.yml.
# This workflow still uses the bound overlay build script so the bundled
# opencorvus sidecar and overlay stay aligned.

on:
  workflow_dispatch:

jobs:
  build-overlay:
    name: overlay (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
            ext: ""
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          - runner: macos-latest
            platform: darwin-arm64
            ext: ""
          - runner: macos-15-intel
            platform: darwin-x64
            ext: ""
          - runner: windows-latest
            platform: windows-x64
            ext: ".exe"

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Sync repo versions
        run: bun ./script/sync-version.ts --check

      - name: Resolve repo version
        id: version
        shell: bash
        run: |
          VERSION="$(bun -e 'const pkg = await Bun.file("packages/opencorvus/package.json").json(); console.log(pkg.version)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/overlay/src-tauri -> target

      - name: Build bound overlay
        working-directory: packages/overlay
        run: bun run build

      - name: Stage overlay artifact
        shell: bash
        run: |
          OUT="packages/overlay/dist-artifacts/${{ matrix.platform }}"
          mkdir -p "$OUT"
          cp -f packages/overlay/src-tauri/target/release/opencorvus-overlay* "$OUT/" 2>/dev/null || true
          find packages/overlay/src-tauri/target/release/bundle -type f -exec cp {} "$OUT/" \; 2>/dev/null || true

      - name: Validate overlay assets
        run: >
          bun ./script/check-release-assets.ts overlay
          --dir packages/overlay/dist-artifacts/${{ matrix.platform }}
          --platform "${{ matrix.platform }}"
          --version "${{ steps.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-${{ matrix.platform }}
          path: packages/overlay/dist-artifacts/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
