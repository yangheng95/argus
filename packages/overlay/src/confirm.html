<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #0f1f34f2;
      --bg-2: #122743f0;
      --line: #c6e1ff3b;
      --text: #eef6ff;
      --muted: #9eb8d8;
      --ok: #6de0ba;
      --cancel: #fca5a5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
      padding: 12px;
    }

    #card {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(160deg, var(--bg), var(--bg-2));
      color: var(--text);
      display: grid;
      grid-template-rows: auto 1fr auto;
      box-shadow: 0 20px 50px #00000050;
    }

    #title {
      padding: 12px 14px 2px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    #msg {
      padding: 6px 14px 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      overflow: auto;
      white-space: pre-wrap;
    }

    #actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid #ffffff1d;
    }

    button {
      border: 1px solid #ffffff2a;
      background: #173052;
      color: var(--text);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      padding: 8px 12px;
      cursor: pointer;
    }

    #ok {
      border-color: #7ae8c84a;
      color: var(--ok);
    }

    #cancel {
      border-color: #ffb4b44a;
      color: var(--cancel);
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="card">
      <div id="title">Confirm Next Step</div>
      <div id="msg">Continue?</div>
      <div id="actions">
        <button id="cancel">Cancel</button>
        <button id="ok">Confirm</button>
      </div>
    </div>
  </div>
  <script src="confirm.js"></script>
</body>
</html>
