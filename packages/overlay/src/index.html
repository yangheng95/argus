<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: rgba(16, 18, 30, 0.9);
      --line: rgba(255, 255, 255, 0.16);
      --text: rgba(245, 247, 255, 0.96);
      --muted: rgba(245, 247, 255, 0.78);
      --accent: rgba(110, 168, 254, 0.9);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      background: #10121e;
      border-radius: 14px;
    }

    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #focus {
      position: absolute;
      left: 50%;
      top: 88px;
      width: 94px;
      height: 94px;
      transform: translate(-50%, -50%) scale(0.75);
      border-radius: 999px;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18), 0 0 32px rgba(110, 168, 254, 0.35);
      opacity: 0;
      transition: opacity 120ms ease, transform 220ms ease;
    }

    #focus::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: inherit;
      border: 2px solid rgba(255, 255, 255, 0.26);
      opacity: 0;
    }

    #focus.pointer.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #focus.pointer.visible::after {
      animation: pulse 580ms ease-out;
    }

    #focus.done {
      border-color: rgba(52, 211, 153, 0.95);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.14), 0 0 28px rgba(16, 185, 129, 0.36);
    }

    #popup {
      position: absolute;
      left: 50%;
      top: 28px;
      transform: translateX(-50%) translateY(4px);
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
      max-width: 360px;
      padding: 10px 14px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(25, 29, 46, 0.95), var(--bg));
      border: 1px solid var(--line);
      backdrop-filter: blur(4px);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    #popup.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #popup.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-4px);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    #popup.done {
      --accent: rgba(52, 211, 153, 0.95);
      border-color: rgba(52, 211, 153, 0.3);
    }

    #popup[data-action="click"],
    #popup[data-action="double"],
    #popup[data-action="right"],
    #popup[data-action="middle"] { --accent: rgba(96, 165, 250, 0.94); }
    #popup[data-action="type"]   { --accent: rgba(52, 211, 153, 0.94); }
    #popup[data-action="key"]    { --accent: rgba(251, 191, 36, 0.94); }
    #popup[data-action="scroll"] { --accent: rgba(167, 139, 250, 0.94); }
    #popup[data-action="drag"]   { --accent: rgba(248, 113, 113, 0.94); }
    #popup[data-action="move"]   { --accent: rgba(129, 140, 248, 0.9); }

    #popup::before {
      content: "";
      width: 3px;
      height: 18px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 14px rgba(110, 168, 254, 0.48);
      flex-shrink: 0;
    }

    #icon {
      width: 16px;
      height: 16px;
      color: var(--text);
      flex-shrink: 0;
    }

    #icon svg {
      width: 100%;
      height: 100%;
    }

    #label {
      color: var(--muted);
      letter-spacing: 0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes pulse {
      from {
        opacity: 0.85;
        transform: scale(0.8);
      }
      to {
        opacity: 0;
        transform: scale(1.28);
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="focus"></div>
    <div id="popup">
      <span id="icon"></span>
      <span id="label"></span>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
