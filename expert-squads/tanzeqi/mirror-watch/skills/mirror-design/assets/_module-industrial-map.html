<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Industrial Production Map</title>
<style>
  body { margin: 0; padding: 24px; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1A1A1A; }
  .industrial-map { max-width: 960px; margin: 0 auto; }
  .industrial-map__header { margin-bottom: 12px; }
  .industrial-map__title { font-size: 16px; font-weight: 600; margin: 0 0 4px 0; color: #1A1A1A; }
  .industrial-map__subtitle { font-size: 12px; color: #6B7280; margin: 0; }
  .industrial-map__svg-wrap { width: 100%; aspect-ratio: 960 / 500; background: #FFFFFF; }
  .industrial-map__svg { width: 100%; height: 100%; display: block; }
  .industrial-map__country { fill: #F2F2F2; stroke: #FFFFFF; stroke-width: 0.5; }
  .industrial-map__country--t1 { fill: #E8F0FF; }
  .industrial-map__country--t2 { fill: #B8CFFF; }
  .industrial-map__country--t3 { fill: #6E91FF; }
  .industrial-map__country--t4 { fill: #165DFF; }
  .industrial-map__country--t5 { fill: #0A3CB8; }
  .industrial-map__legend { display: flex; align-items: center; justify-content: center; gap: 0; margin-top: 12px; font-size: 11px; color: #6B7280; }
  .industrial-map__legend-label { padding: 0 8px; min-width: 32px; text-align: center; }
  .industrial-map__legend-swatches { display: flex; }
  .industrial-map__legend-swatch { width: 48px; height: 12px; }
  .industrial-map__legend-title { font-size: 11px; color: #6B7280; margin-right: 12px; font-weight: 500; }
</style>
</head>
<body>
  <div class="industrial-map">
    <div class="industrial-map__header">
      <h3 class="industrial-map__title">Global Industrial Production</h3>
      <p class="industrial-map__subtitle">Year-over-year change in industrial output by country</p>
    </div>
    <div class="industrial-map__svg-wrap">
      <svg class="industrial-map__svg" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet" id="industrialMapSvg"></svg>
    </div>
    <div class="industrial-map__legend">
      <span class="industrial-map__legend-title">Industrial YoY</span>
      <span class="industrial-map__legend-label">0%</span>
      <div class="industrial-map__legend-swatches">
        <div class="industrial-map__legend-swatch" style="background:#E8F0FF"></div>
        <div class="industrial-map__legend-swatch" style="background:#B8CFFF"></div>
        <div class="industrial-map__legend-swatch" style="background:#6E91FF"></div>
        <div class="industrial-map__legend-swatch" style="background:#165DFF"></div>
        <div class="industrial-map__legend-swatch" style="background:#0A3CB8"></div>
      </div>
      <span class="industrial-map__legend-label">25%</span>
      <span class="industrial-map__legend-label" style="margin-left:16px;">3% · 7% · 12%</span>
    </div>
  </div>

<!-- D3 + TopoJSON via BootCDN (国内首选) -->
<script src="https://cdn.bootcdn.net/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(function(){
  // Industrial production YoY (%) keyed by ISO 3166-1 numeric code
  var industrialData = {
    840: 1.4, 156: 4.1, 356: 4.1, 392: 2.4, 276: -2.8, 826: 0.0, 250: 0.9,
    124: -1.2, 643: 2.3, 76: 3.5, 32: -1.5, 792: 5.0, 484: 2.5, 710: 1.0,
    36: 1.5, 410: 6.5, 360: 4.0, 682: 3.5, 566: 12.0, 704: 8.5, 764: 3.0,
    608: 4.5, 616: 5.5, 300: 2.5, 724: 3.0, 380: 1.2, 528: 2.0, 56: 0.5,
    40: 1.8, 578: 4.0, 752: 2.5, 246: 1.5, 208: 3.0, 152: 5.5, 604: 6.5,
    170: 4.0, 398: 7.0, 860: 8.0, 364: 13.0, 368: 15.0, 784: 5.5, 504: 4.0,
    /* a few more to round out the map */
    818: 3.2,   // Egypt
    422: 1.0,   // Lebanon
    400: 2.5,   // Jordan
    458: 4.5,   // Malaysia
    702: 2.0,   // Singapore
    158: 5.5,   // Taiwan
    344: 3.0,   // Hong Kong
    104: 6.0,   // Myanmar
    116: 5.0,   // Cambodia
    50: 4.5,    // Bangladesh
    586: 3.0,   // Pakistan
    144: 2.5,   // Sri Lanka
    51: -1.0,   // Armenia
    268: 4.0,   // Georgia
    31: 5.0,    // Azerbaijan
    642: 4.5,   // Romania
    100: 3.0,   // Bulgaria
    348: 5.0,   // Hungary
    203: 4.0,   // Czechia
    703: 3.5,   // Slovakia
    191: 2.5,   // Croatia
    705: 3.0,   // Slovenia
    688: 4.0,   // Serbia
    804: 3.5,   // Ukraine
    112: 2.0,   // Belarus
    440: 2.0,   // Lithuania
    428: 2.5,   // Latvia
    233: 3.0,   // Estonia
    372: 2.0,   // Ireland
    620: 2.5,   // Portugal
    756: 1.0,   // Switzerland
    231: 5.0,   // Ethiopia
    404: 3.5,   // Kenya
    834: 3.0,   // Tanzania
    800: 4.0,   // Uganda
    180: 2.0,   // DRC
    24: 2.5,    // Angola
    894: 1.5,   // Zambia
    716: -1.0,  // Zimbabwe
    288: 4.5,   // Ghana
    384: 3.5,   // Cote d'Ivoire
    686: 3.0,   // Senegal
    12: 1.0,    // Algeria
    788: 2.5,   // Tunisia
    434: 6.0,   // Libya
    729: 2.0,   // Sudan
    858: 2.5,   // Uruguay
    600: 3.0,   // Paraguay
    218: -2.0,  // Ecuador
    862: 1.0,   // Venezuela
    188: 4.0,   // Costa Rica
    320: 3.5,   // Guatemala
    192: 1.5,   // Cuba
    214: 3.0,   // Dominican Republic
    332: 1.0,   // Haiti
    554: 1.5,   // New Zealand
    554: 1.5,   // New Zealand
    591: 3.0,   // Panama
    222: 2.5,   // El Salvador
    340: 3.0,   // Honduras
    558: 2.0,   // Nicaragua
    548: 3.5,   // Vanuatu (placeholder)
    608: 4.5,   // Philippines (dup ok)
    634: 2.0,   // Qatar
    414: 3.0,   // Kuwait
    48: 2.5,    // Bahrain
    512: 3.5,   // Oman
    887: 0.5,   // Yemen
    275: 1.0,   // Palestine
    417: 5.0,   // Kyrgyzstan
    762: 6.5,   // Tajikistan
    795: 4.5,   // Turkmenistan
    496: 4.0,   // Mongolia
    408: 2.0    // North Korea
  };

  function tierClass(v){
    if (v === undefined || v === null) return '';
    if (v < 2) return 'industrial-map__country--t1';
    if (v < 5) return 'industrial-map__country--t2';
    if (v < 10) return 'industrial-map__country--t3';
    if (v < 20) return 'industrial-map__country--t4';
    return 'industrial-map__country--t5';
  }

  var TOPO_URLS = [
    'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
    'https://cdn.bootcdn.net/ajax/libs/world-atlas/2.0.2/countries-110m.json',
    'https://unpkg.com/world-atlas@2/countries-110m.json'
  ];

  function loadTopo(i){
    if (i >= TOPO_URLS.length) return Promise.reject(new Error('all topo CDNs failed'));
    return fetch(TOPO_URLS[i]).then(function(r){
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).catch(function(){ return loadTopo(i+1); });
  }

  loadTopo(0).then(function(world){
    var svg = d3.select('#industrialMapSvg');
    var countries = topojson.feature(world, world.objects.countries);

    var projection = d3.geoNaturalEarth1()
      .fitSize([960, 500], countries);
    var path = d3.geoPath(projection);

    svg.append('g')
      .selectAll('path')
      .data(countries.features)
      .enter()
      .append('path')
      .attr('d', path)
      .attr('class', function(d){
        var v = industrialData[+d.id];
        var t = tierClass(v);
        return 'industrial-map__country' + (t ? ' ' + t : '');
      });
  }).catch(function(err){
    var svg = document.getElementById('industrialMapSvg');
    svg.innerHTML = '<text x="480" y="250" text-anchor="middle" fill="#999" font-size="14">Map data unavailable</text>';
    console.error(err);
  });
})();
</script>
</body>
</html>
