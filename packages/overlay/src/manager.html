<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenCorvus Console</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      color: var(--text-primary);
      font-family: var(--font-ui);
      background:
        radial-gradient(900px 480px at 5% -8%, rgba(99, 102, 241, 0.12), transparent 55%),
        radial-gradient(600px 400px at 100% 0%, rgba(6, 182, 212, 0.09), transparent 50%),
        linear-gradient(168deg, var(--surface-0), var(--surface-1) 48%, var(--surface-2));
      overflow: hidden;
    }

    .shell {
      height: 100%;
      padding: 16px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    /* ── Header ── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
    }

    /* Top gradient accent line */
    .top::before {
      content: "";
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 1px;
      background: var(--brand-gradient);
      opacity: 0.5;
      border-radius: 1px;
    }

    .top { position: relative; }

    .title {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .title strong {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--glass-border);
      background: rgba(10, 14, 26, 0.6);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-pill);
      background: var(--text-muted);
      box-shadow: 0 0 0 4px rgba(100, 116, 139, 0.12);
      transition: background 200ms var(--ease), box-shadow 200ms var(--ease);
    }

    .status.running .status-dot {
      background: var(--color-done);
      box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.15);
    }

    /* ── Main layout ── */
    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 12px;
    }

    /* ── Cards ── */
    .card {
      min-height: 0;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-head {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Chat ── */
    .chat {
      min-height: 0;
      flex: 1;
      padding: 14px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      line-height: 1.45;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid transparent;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(6, 182, 212, 0.12));
      border-color: rgba(99, 102, 241, 0.22);
    }

    .msg.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.07);
    }

    .msg.system {
      align-self: center;
      max-width: 96%;
      background: rgba(251, 191, 36, 0.08);
      border-color: rgba(251, 191, 36, 0.2);
      color: rgba(251, 191, 36, 0.85);
      font-size: 12px;
    }

    /* ── Composer ── */
    .composer {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    textarea,
    input {
      width: 100%;
      color: var(--text-primary);
      background: rgba(10, 14, 26, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      resize: none;
      outline: none;
      transition: border-color 120ms var(--ease), box-shadow 120ms var(--ease);
    }

    textarea:focus,
    input:focus {
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .send {
      min-width: 100px;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0 16px;
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 13px;
      color: var(--surface-0);
      background: var(--brand-gradient);
      cursor: pointer;
      transition: opacity 120ms var(--ease), box-shadow 120ms var(--ease);
    }

    .send:hover {
      opacity: 0.9;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.25);
    }

    .send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Side panels ── */
    .side {
      min-height: 0;
      display: grid;
      grid-template-rows: 0.92fr 1.08fr;
      gap: 12px;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    button {
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      transition: background 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease);
    }

    button:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--glass-border-hover);
      color: var(--text-primary);
    }

    .btn-primary {
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.3);
      color: var(--color-done);
    }

    .btn-primary:hover {
      background: rgba(52, 211, 153, 0.18);
      border-color: rgba(52, 211, 153, 0.45);
    }

    .btn-danger {
      background: rgba(248, 113, 113, 0.08);
      border-color: rgba(248, 113, 113, 0.25);
      color: var(--color-drag);
    }

    .btn-danger:hover {
      background: rgba(248, 113, 113, 0.15);
      border-color: rgba(248, 113, 113, 0.4);
    }

    /* ── Logs ── */
    .log-body {
      min-height: 0;
      flex: 1;
      margin: 0;
      padding: 12px;
      overflow: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Config panel ── */
    .cfg {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 14px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .cfg label {
      display: grid;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .save-wrap {
      display: flex;
      justify-content: flex-end;
    }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    @media (max-width: 1100px) {
      .main {
        grid-template-columns: 1fr;
      }

      .side {
        grid-template-rows: 340px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="title">
        <strong>OpenCorvus Console</strong>
        <span>System tray + command console + bot configuration</span>
      </div>
      <div class="status" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">Stopped</span>
        <span id="pidText">PID: -</span>
      </div>
    </header>

    <div class="main">
      <section class="card">
        <div class="card-head">Conversation</div>
        <div class="chat" id="chat"></div>
        <form class="composer" id="sendForm">
          <textarea id="promptInput" rows="3" placeholder="Send instruction to OpenCorvus..."></textarea>
          <button class="send" id="sendBtn" type="submit">Send</button>
        </form>
      </section>

      <div class="side">
        <section class="card">
          <div class="card-head">Runtime</div>
          <div class="toolbar">
            <button class="btn-primary" id="startBtn" type="button">Start</button>
            <button class="btn-danger" id="stopBtn" type="button">Stop</button>
            <button id="refreshBtn" type="button">Refresh</button>
            <button id="clearLogsBtn" type="button">Clear</button>
          </div>
          <pre class="log-body" id="logs"></pre>
        </section>

        <section class="card">
          <div class="card-head">Bot Config</div>
          <div class="cfg">
            <label>Command
              <input id="commandInput" placeholder="opencorvus" />
            </label>
            <label>Working Directory
              <input id="cwdInput" placeholder="(optional)" />
            </label>
            <label>Start Args (one per line)
              <textarea id="serveArgsInput" rows="4"></textarea>
            </label>
            <label>Prompt Args (one per line)
              <textarea id="runArgsInput" rows="4"></textarea>
            </label>
            <label>Env (KEY=VALUE, one per line)
              <textarea id="envInput" rows="4"></textarea>
            </label>
            <div class="save-wrap">
              <button id="saveBtn" type="button">Save Config</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="tauri-bridge.js"></script>
  <script src="manager.js"></script>
</body>
</html>
