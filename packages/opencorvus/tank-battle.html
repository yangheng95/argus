<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Battle - 2 Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #1a1a2e; font-family: Arial, sans-serif;
        }
        #gameContainer { text-align: center; }
        #gameCanvas { border: 3px solid #4a4a6a; background: #2a2a4a; }
        #score {
            color: #fff; font-size: 24px; margin-bottom: 10px;
            display: flex; justify-content: space-between; width: 800px;
        }
        .p1-score { color: #4fc3f7; }
        .p2-score { color: #ef5350; }
        #controls { color: #aaa; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">
            <span class="p1-score">P1: <span id="p1Score">0</span></span>
            <span class="p2-score">P2: <span id="p2Score">0</span></span>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="controls">
            P1: WASD to move, Space to shoot | P2: Arrow Keys to move, Enter to shoot
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const p1ScoreEl = document.getElementById('p1Score');
        const p2ScoreEl = document.getElementById('p2Score');

        const TANK_SIZE = 40, BULLET_SIZE = 8, SPEED = 4, BULLET_SPEED = 8;
        let p1Score = 0, p2Score = 0;
        const keys = {};

        const tank1 = {
            x: 100, y: 300, width: TANK_SIZE, height: TANK_SIZE,
            color: '#4fc3f7', direction: 'right', bullets: [],
            lastShot: 0, respawnTime: 0
        };

        const tank2 = {
            x: 660, y: 300, width: TANK_SIZE, height: TANK_SIZE,
            color: '#ef5350', direction: 'left', bullets: [],
            lastShot: 0, respawnTime: 0
        };

        const obstacles = [
            { x: 300, y: 150, width: 200, height: 40 },
            { x: 300, y: 410, width: 200, height: 40 },
            { x: 380, y: 250, width: 40, height: 100 },
            { x: 150, y: 80, width: 40, height: 100 },
            { x: 610, y: 420, width: 40, height: 100 }
        ];

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Space', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function checkObstacleCollision(x, y, width, height) {
            for (const obs of obstacles) {
                if (checkCollision({ x, y, width, height }, obs)) return true;
            }
            return false;
        }

        function updateTank(tank, controls, opponent) {
            if (Date.now() < tank.respawnTime) return;
            let newX = tank.x, newY = tank.y;

            if (keys[controls.up]) { newY -= SPEED; tank.direction = 'up'; }
            if (keys[controls.down]) { newY += SPEED; tank.direction = 'down'; }
            if (keys[controls.left]) { newX -= SPEED; tank.direction = 'left'; }
            if (keys[controls.right]) { newX += SPEED; tank.direction = 'right'; }

            if (newX >= 0 && newX + tank.width <= canvas.width &&
                !checkObstacleCollision(newX, tank.y, tank.width, tank.height)) {
                tank.x = newX;
            }
            if (newY >= 0 && newY + tank.height <= canvas.height &&
                !checkObstacleCollision(tank.x, newY, tank.width, tank.height)) {
                tank.y = newY;
            }

            if (keys[controls.shoot] && Date.now() - tank.lastShot > 500) {
                tank.bullets.push({
                    x: tank.x + tank.width / 2 - BULLET_SIZE / 2,
                    y: tank.y + tank.height / 2 - BULLET_SIZE / 2,
                    direction: tank.direction
                });
                tank.lastShot = Date.now();
            }
        }

        function updateBullets(tank, opponent, isP1) {
            for (let i = tank.bullets.length - 1; i >= 0; i--) {
                const bullet = tank.bullets[i];
                switch (bullet.direction) {
                    case 'up': bullet.y -= BULLET_SPEED; break;
                    case 'down': bullet.y += BULLET_SPEED; break;
                    case 'left': bullet.x -= BULLET_SPEED; break;
                    case 'right': bullet.x += BULLET_SPEED; break;
                }

                if (bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                    tank.bullets.splice(i, 1); continue;
                }

                let hitObstacle = false;
                for (const obs of obstacles) {
                    if (checkCollision(bullet, obs)) { hitObstacle = true; break; }
                }
                if (hitObstacle) { tank.bullets.splice(i, 1); continue; }

                if (Date.now() >= opponent.respawnTime && checkCollision(bullet, opponent)) {
                    tank.bullets.splice(i, 1);
                    opponent.respawnTime = Date.now() + 2000;
                    opponent.x = isP1 ? 660 : 100;
                    opponent.y = 300;
                    opponent.direction = isP1 ? 'left' : 'right';
                    if (isP1) { p1Score++; p1ScoreEl.textContent = p1Score; }
                    else { p2Score++; p2ScoreEl.textContent = p2Score; }
                }
            }
        }

        function drawTank(tank) {
            if (Date.now() < tank.respawnTime) {
                const remaining = Math.ceil((tank.respawnTime - Date.now()) / 1000);
                ctx.fillStyle = tank.color + '80';
                ctx.font = '20px Arial'; ctx.textAlign = 'center';
                ctx.fillText('Respawn: ' + remaining, tank.x + tank.width/2, tank.y - 10);
                return;
            }

            ctx.fillStyle = tank.color;
            ctx.fillRect(tank.x, tank.y, tank.width, tank.height);

            ctx.fillStyle = '#333';
            const turretSize = 20;
            ctx.fillRect(tank.x + tank.width/2 - turretSize/2, tank.y + tank.height/2 - turretSize/2, turretSize, turretSize);

            ctx.fillStyle = '#555';
            const barrelLength = 25, barrelWidth = 6;
            switch (tank.direction) {
                case 'up':
                    ctx.fillRect(tank.x + tank.width/2 - barrelWidth/2, tank.y, barrelWidth, barrelLength); break;
                case 'down':
                    ctx.fillRect(tank.x + tank.width/2 - barrelWidth/2, tank.y + tank.height - barrelLength, barrelWidth, barrelLength); break;
                case 'left':
                    ctx.fillRect(tank.x, tank.y + tank.height/2 - barrelWidth/2, barrelLength, barrelWidth); break;
                case 'right':
                    ctx.fillRect(tank.x + tank.width - barrelLength, tank.y + tank.height/2 - barrelWidth/2, barrelLength, barrelWidth); break;
            }
        }

        function drawBullets(tank) {
            ctx.fillStyle = '#ffeb3b';
            for (const bullet of tank.bullets) {
                ctx.beginPath();
                ctx.arc(bullet.x + BULLET_SIZE/2, bullet.y + BULLET_SIZE/2, BULLET_SIZE/2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawObstacles() {
            ctx.fillStyle = '#6a6a8a';
            for (const obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeStyle = '#
