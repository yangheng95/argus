id = "opencorvus"
name = "OpenCorvus"
description = "The open source coding agent."
version = "0.0.1"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/yangheng95/opencorvus"

[agent_servers.opencorvus]
name = "OpenCorvus"
icon = "./icons/opencorvus.svg"

[agent_servers.opencorvus.targets.darwin-aarch64]
archive = "https://github.com/yangheng95/opencorvus/releases/download/v0.0.1/opencorvus-darwin-arm64.zip"
cmd = "./opencorvus"
args = ["acp"]

[agent_servers.opencorvus.targets.darwin-x86_64]
archive = "https://github.com/yangheng95/opencorvus/releases/download/v0.0.1/opencorvus-darwin-x64.zip"
cmd = "./opencorvus"
args = ["acp"]

[agent_servers.opencorvus.targets.linux-aarch64]
archive = "https://github.com/yangheng95/opencorvus/releases/download/v0.0.1/opencorvus-linux-arm64.tar.gz"
cmd = "./opencorvus"
args = ["acp"]

[agent_servers.opencorvus.targets.linux-x86_64]
archive = "https://github.com/yangheng95/opencorvus/releases/download/v0.0.1/opencorvus-linux-x64.tar.gz"
cmd = "./opencorvus"
args = ["acp"]

[agent_servers.opencorvus.targets.windows-x86_64]
archive = "https://github.com/yangheng95/opencorvus/releases/download/v0.0.1/opencorvus-windows-x64.zip"
cmd = "./opencorvus.exe"
args = ["acp"]
