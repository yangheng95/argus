<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      background: transparent;
    }

    #root {
      position: absolute;
      inset: 0;
      padding: 4px;
    }

    #frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      border: 3px solid rgba(56, 189, 248, 0.85);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.15),
        inset 0 0 0 1px rgba(56, 189, 248, 0.12),
        0 0 24px rgba(56, 189, 248, 0.3);
      opacity: 0;
      transform: scale(0.992);
      transition: opacity 100ms ease, transform 100ms ease;
    }

    #frame.visible {
      opacity: 1;
      transform: scale(1);
    }

    #label {
      position: absolute;
      top: 6px;
      left: 8px;
      max-width: calc(100% - 16px);
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(8, 17, 32, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: rgba(240, 249, 255, 0.92);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    /* Corner markers for precise framing */
    #frame::before,
    #frame::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: rgba(125, 211, 252, 0.6);
      border-style: solid;
      border-width: 0;
    }

    #frame::before {
      top: -1px;
      right: -1px;
      border-top-width: 2px;
      border-right-width: 2px;
      border-top-right-radius: 4px;
    }

    #frame::after {
      bottom: -1px;
      left: -1px;
      border-bottom-width: 2px;
      border-left-width: 2px;
      border-bottom-left-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="frame">
      <div id="label">OpenCorvus target window</div>
    </div>
  </div>
  <script src="tauri-bridge.js"></script>
  <script src="window-highlight.js"></script>
</body>
</html>
