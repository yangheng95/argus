<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      background: transparent;
    }

    #root {
      position: absolute;
      inset: 0;
      padding: 3px;
    }

    #frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      border: 2px solid transparent;
      background:
        linear-gradient(transparent, transparent) padding-box,
        var(--brand-gradient) border-box;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 28px rgba(var(--brand-from-rgb), 0.18),
        0 0 56px rgba(6, 182, 212, 0.08);
      opacity: 0;
      transform: scale(0.996);
      transition: opacity 120ms var(--ease), transform 120ms var(--ease);
    }

    #frame.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Animated top-edge scan line ── */
    #frame::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        var(--brand-from) 20%,
        var(--brand-to) 80%,
        transparent);
      opacity: 0;
    }

    #frame.visible::before {
      animation: scan-line 2.4s var(--ease) 0.15s forwards;
    }

    #label {
      position: absolute;
      top: 8px;
      left: 10px;
      max-width: calc(100% - 20px);
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    /* ── Brand dot in label ── */
    #label::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--brand-gradient);
      margin-right: 6px;
      vertical-align: middle;
      box-shadow: 0 0 6px rgba(var(--brand-from-rgb), 0.4);
    }

    @keyframes scan-line {
      0% { opacity: 0.8; left: 0; right: 100%; }
      50% { opacity: 1; left: 0; right: 0; }
      100% { opacity: 0; left: 0; right: 0; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="frame">
      <div id="label">OpenCorvus target window</div>
    </div>
  </div>
  <script src="tauri-bridge.js"></script>
  <script src="window-highlight.js"></script>
</body>
</html>
