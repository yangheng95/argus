name: build-vscode-extension

# Packages the VS Code extension as 5 platform-specific VSIX files
# (plan-vscode-extension.md M7 / §8 / §19.1.4 / §19.2.5).
#
# Per CLAUDE.md §一-7 / 二-8 we never ship a universal "no-target"
# VSIX: a universal package would silently install on unsupported
# architectures with the wrong sidecar binary. Each matrix entry
# produces exactly one target's VSIX or fails.
#
# Marketplace publish is intentionally NOT automated here. Until the
# Apple Developer ID + macOS notarisation flow is wired in (plan
# §19.2.5 — pending external account setup), an unsigned darwin
# binary inside a published VSIX would be rejected by Gatekeeper on
# first launch. This workflow uploads each VSIX as an Actions
# artifact + (on tag triggers) attaches them to the GitHub release;
# `vsce publish` is run by hand once the signing story lands.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (no v prefix). Empty → dev snapshot artifact."
        required: false
        default: ""
      run_id:
        description: "build.yml run ID to source opencorvus-dist artifacts from. Empty → latest successful run on this ref."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  package:
    name: package vsix (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            platform: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            platform: linux-arm64
            runner: ubuntu-latest
          - target: darwin-x64
            platform: darwin-x64
            runner: ubuntu-latest
          - target: darwin-arm64
            platform: darwin-arm64
            runner: ubuntu-latest
          - target: win32-x64
            platform: windows-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
            VERSION="${V#v}"
          else
            VERSION="0.0.0-dev-$(date -u +%Y%m%d%H%M)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync repo versions
        run: bun ./script/sync-version.ts "${{ steps.meta.outputs.version }}"

      # Locate the build.yml run whose opencorvus-dist-${platform}
      # artifact we want. Either the user supplied a run_id directly
      # or we resolve the latest successful build.yml run on the
      # current branch / tag. This is a CI source-selection convenience
      # for the same commit, not a runtime behavior change.
      - name: Resolve build.yml run id
        id: runid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ inputs.run_id }}" ]]; then
            echo "id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ID=$(gh run list \
            --workflow=build.yml \
            --branch="${GITHUB_REF_NAME}" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [[ -z "$ID" || "$ID" == "null" ]]; then
            echo "::error::no successful build.yml run found on ${GITHUB_REF_NAME}; build it first or pass run_id"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Download opencorvus-dist artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages/opencorvus/dist
          gh run download "${{ steps.runid.outputs.id }}" \
            --name "opencorvus-dist-${{ matrix.platform }}" \
            --dir packages/opencorvus/dist
          ls packages/opencorvus/dist

      - name: Build overlay UI (vite)
        run: bun run --cwd packages/overlay build:vite

      - name: Package VSIX
        run: |
          bun run --cwd packages/vscode-extension script/package-vsix.ts \
            --target "${{ matrix.target }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencorvus-vsix-${{ matrix.target }}
          path: packages/vscode-extension/dist-vsix/*.vsix
          retention-days: 14

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            packages/vscode-extension/dist-vsix/*.vsix \
            --clobber
