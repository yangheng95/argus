<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Economy - Rankings and Forecasts - TradingView Clone</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="TradingView navigation">
      <button class="icon-button mobile-only" aria-label="Open navigation">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" href="#" aria-label="TradingView">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-word desktop-only">TradingView</span>
      </a>
      <label class="search-pill desktop-only" aria-label="Search">
        <span class="search-icon" aria-hidden="true"></span>
        <input value="Search (Ctrl+K)" readonly />
      </label>
      <nav class="desktop-only primary-nav" aria-label="Primary">
        <a href="#">Products</a>
        <a href="#">Community</a>
        <a class="active" href="#">Markets</a>
        <a href="#">Brokers</a>
        <a href="#">More</a>
      </nav>
      <div class="header-spacer"></div>
      <button class="icon-button desktop-only globe-button" aria-label="Language">◎</button>
      <span class="desktop-only language">EN</span>
      <button class="icon-button mobile-search mobile-only" aria-label="Search">
        <span class="search-icon" aria-hidden="true"></span>
      </button>
      <button class="icon-button desktop-only account-button" aria-label="Account"></button>
      <a class="cta" href="#">Get started</a>
    </header>

    <main>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="#">Markets</a>
        <span>/</span>
        <a class="muted" href="#">Economy</a>
      </nav>

      <section class="hero" aria-labelledby="page-title">
        <p>Economy</p>
        <h1 id="page-title">Overview <span aria-hidden="true">⌄</span></h1>
      </section>

      <section class="content-band" aria-labelledby="economic-trends-title">
        <h2 id="economic-trends-title">Economic trends</h2>
        <div class="trend-grid">
          <article class="card map-card" aria-labelledby="inflation-map-title">
            <h3 id="inflation-map-title">Inflation map</h3>
            <div id="inflation-map" class="map-visual" aria-label="Inflation map"></div>
            <div class="map-legend" aria-label="Inflation scale">
              <div class="legend-labels">
                <span>0%</span>
                <span>7%</span>
                <span>25%</span>
              </div>
              <div class="legend-bar" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
          </article>

          <article class="card gdp-card" aria-labelledby="gdp-title">
            <h3 id="gdp-title">GDP growth, YoY</h3>
            <div id="gdp-table" class="gdp-table"></div>
          </article>
        </div>

        <div id="indicator-grid" class="indicator-grid"></div>
      </section>

      <section class="content-band countries-section" aria-labelledby="countries-title">
        <h2 id="countries-title">Countries<span aria-hidden="true">›</span></h2>
        <div id="country-chips" class="chip-row"></div>
      </section>

      <section class="content-band lower-grid" aria-label="Economy details">
        <article class="wide-section ideas-section">
          <div class="section-heading">
            <h2>Ideas<span aria-hidden="true">›</span></h2>
            <div class="tab-row" aria-label="Idea filters">
              <button class="tab active">Popular</button>
              <button class="tab">Recent</button>
              <button class="tab">Video</button>
            </div>
          </div>
          <div id="ideas-list" class="ideas-list"></div>
        </article>

        <aside class="side-stack">
          <article class="compact-section">
            <h2>News<span aria-hidden="true">›</span></h2>
            <div id="news-list" class="news-list"></div>
          </article>
          <article class="compact-section">
            <h2>Economic Calendar<span aria-hidden="true">›</span></h2>
            <div id="calendar-list" class="calendar-list"></div>
          </article>
        </aside>
      </section>

      <section class="content-band faq-section" aria-labelledby="faq-title">
        <h2 id="faq-title">FAQ</h2>
        <div id="faq-list" class="faq-list"></div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
