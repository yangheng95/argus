name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.0.1 or v0.0.1). Leave empty for dev snapshot artifact builds."
        required: false
        default: ""

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.meta.outputs.release }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install_dependencies: "false"

      - name: Resolve version and release flag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=1
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            RELEASE=1
          else
            VERSION="$(bun -e 'const pkg = await Bun.file("packages/opencorvus/package.json").json(); console.log(pkg.version)')"
            RELEASE=0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Sync repo versions
        shell: bash
        run: bun ./script/sync-version.ts "${{ steps.meta.outputs.version }}"

      - name: Verify version alignment
        shell: bash
        run: bun ./script/sync-version.ts "${{ steps.meta.outputs.version }}" --check

      - name: Create GitHub Release
        if: steps.meta.outputs.release == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

  package-cli:
    name: cli (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Sync repo versions
        run: bun ./script/sync-version.ts "${{ needs.prepare.outputs.version }}"

      - name: Build SDK package
        run: bun ./packages/sdk/js/script/build.ts

      - name: Install Linux CLI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Install macOS CLI runtime dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep
          rg --version

      - name: Install Windows CLI runtime dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ripgrep --yes --no-progress
          rg --version

      - name: Fetch models.dev snapshot
        run: curl -fsSL https://models.dev/api.json | tr -d '\n\r' > /tmp/models-api-clean.json

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cli-${{ matrix.platform }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-cli-${{ matrix.platform }}-

      - name: Build CLI (native + baseline)
        working-directory: packages/opencorvus
        env:
          MODELS_DEV_API_JSON: /tmp/models-api-clean.json
          OPENCORVUS_RELEASE: ${{ needs.prepare.outputs.release == '1' && '1' || '' }}
          OPENCORVUS_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCORVUS_CHANNEL: ${{ needs.prepare.outputs.release == '1' && 'latest' || '' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run script/build.ts --single --baseline

      - name: Build CLI (musl, Linux only)
        if: runner.os == 'Linux'
        env:
          MODELS_DEV_API_JSON: /tmp/models-api-clean.json
          OPENCORVUS_RELEASE: ${{ needs.prepare.outputs.release == '1' && '1' || '' }}
          OPENCORVUS_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCORVUS_CHANNEL: ${{ needs.prepare.outputs.release == '1' && 'latest' || '' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The build script reads MODELS_DEV_API_JSON; mount the file into
          # the container so the path the env var points to actually exists.
          # The container installs Alpine Package Keeper (APK) packages as root,
          # then runs Bun as the host UID (User Identifier) / GID (Group
          # Identifier) so later host steps can still write dist files.
          # OPENCORVUS_HOME gives that synthetic user a writable OpenCorvus
          # global data root.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v /tmp/models-api-clean.json:/tmp/models-api-clean.json:ro \
            -w /workspace/packages/opencorvus \
            -e HOME=/tmp \
            -e OPENCORVUS_HOME=/tmp/opencorvus-home \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e MODELS_DEV_API_JSON=/tmp/models-api-clean.json \
            -e OPENCORVUS_RELEASE="${OPENCORVUS_RELEASE}" \
            -e OPENCORVUS_VERSION="${OPENCORVUS_VERSION}" \
            -e OPENCORVUS_CHANNEL="${OPENCORVUS_CHANNEL}" \
            -e GH_REPO="${GH_REPO}" \
            -e GH_TOKEN="${GH_TOKEN}" \
            oven/bun:alpine \
            sh -c 'apk add --no-cache nodejs ripgrep su-exec && mkdir -p "$OPENCORVUS_HOME" && chown -R "$HOST_UID:$HOST_GID" "$OPENCORVUS_HOME" && su-exec "$HOST_UID:$HOST_GID" bun install --frozen-lockfile --no-progress --ignore-scripts --backend=copyfile --network-concurrency=1 && su-exec "$HOST_UID:$HOST_GID" bun run script/build.ts --single --baseline --musl-only --no-clean'

      - name: Build overlay web bundle
        # The CLI ships its overlay UI as static assets under
        # `dist/opencorvus-<platform>/ui/`. build.ts compiles only the
        # native binary, so we must run vite separately and stage the
        # output ourselves; otherwise check-release-assets fails on every
        # platform with "Missing required file: ui/index.html".
        working-directory: packages/overlay
        run: bun run build:vite

      - name: Stage overlay web bundle into CLI dist
        shell: bash
        run: |
          set -euo pipefail
          src="packages/overlay/dist-vite"
          if [[ ! -d "$src" ]]; then
            echo "vite output missing at $src" >&2
            exit 1
          fi
          for d in packages/opencorvus/dist/opencorvus-*; do
            [[ -d "$d" ]] || continue
            mkdir -p "$d/ui"
            cp -R "$src"/. "$d/ui/"
          done

      - name: Package CLI archive
        # Required by `check-release-assets.ts --require-archives` in
        # release mode. Linux ships a `.tar.gz`, macOS / Windows ship a
        # `.zip`, matching `script/check-release-assets.ts`'s contract.
        # The matrix runner determines the host platform, so the case
        # match always picks a tool available in that runner image
        # (tar on Linux, /usr/bin/zip on macOS, 7-Zip on Windows).
        if: needs.prepare.outputs.release == '1'
        shell: bash
        working-directory: packages/opencorvus/dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(opencorvus-${{ matrix.platform }}*)
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "missing opencorvus-${{ matrix.platform }}* directories under packages/opencorvus/dist" >&2
            exit 1
          fi
          for dir in "${dirs[@]}"; do
            [[ -d "$dir" ]] || continue
            name="$(basename "$dir")"
            case "$name" in
              opencorvus-linux-*)
                tar -czf "${name}.tar.gz" -C "$dir" .
                ;;
              opencorvus-darwin-*)
                (cd "$dir" && zip -rq "../${name}.zip" .)
                ;;
              opencorvus-windows-*)
                (cd "$dir" && 7z a -tzip "../${name}.zip" . > /dev/null)
                ;;
              *)
                echo "Unknown CLI dist directory: $dir" >&2
                exit 1
                ;;
            esac
          done

      - name: Validate CLI assets
        run: |
          EXTRA=""
          if [[ "${{ needs.prepare.outputs.release }}" == "1" ]]; then
            EXTRA="--require-archives"
          fi
          platforms=()
          for dir in packages/opencorvus/dist/opencorvus-${{ matrix.platform }}*; do
            [[ -d "$dir" ]] || continue
            platforms+=("${dir##*/opencorvus-}")
          done
          if [[ ${#platforms[@]} -eq 0 ]]; then
            echo "No CLI dist directories found for ${{ matrix.platform }}" >&2
            exit 1
          fi
          platforms_csv="$(IFS=,; echo "${platforms[*]}")"
          bun ./script/check-release-assets.ts cli \
            --dir packages/opencorvus/dist \
            --platforms "$platforms_csv" \
            --version "${{ needs.prepare.outputs.version }}" \
            $EXTRA

      - name: Upload CLI dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencorvus-dist-${{ matrix.platform }}
          path: packages/opencorvus/dist/
          retention-days: 7

  package-overlay:
    name: overlay (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Sync repo versions
        run: bun ./script/sync-version.ts "${{ needs.prepare.outputs.version }}"

      - name: Build SDK package
        run: bun ./packages/sdk/js/script/build.ts

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ripgrep \
            xdg-utils
          rg --version
          # `xdg-utils` provides /usr/bin/xdg-open which Tauri's AppImage
          # bundler shells out to during `--bundles appimage`. Without it
          # the bundle step fails with "xdg-open binary not found
          # /usr/bin/xdg-open" after .deb and .rpm have already been
          # produced. ubuntu-latest happens to ship it preinstalled but
          # ubuntu-24.04-arm doesn't, so the linux-arm64 runner failed.

      - name: Install macOS overlay runtime dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ripgrep
          rg --version

      - name: Install Windows overlay runtime dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ripgrep --yes --no-progress
          rg --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/overlay/src-tauri -> target

      - name: Build bound overlay bundle
        working-directory: packages/overlay
        env:
          OPENCORVUS_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCORVUS_CHANNEL: ${{ needs.prepare.outputs.release == '1' && 'latest' || '' }}
        run: bun run script/build.ts

      - name: Stage overlay artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="packages/overlay/dist-artifacts/${{ matrix.platform }}"
          mkdir -p "$OUT"
          REL="packages/overlay/src-tauri/target/release"
          BIN="opencorvus-overlay"
          if [[ "${{ matrix.platform }}" == windows-* ]]; then BIN="$BIN.exe"; fi
          cp "$REL/$BIN" "$OUT/$BIN"

          # Tauri emits installer bundles under target/release/bundle/<type>/.
          # macOS .app is a directory; tar it so Finder still sees a bundle
          # after the artifact zip round-trips through GitHub Actions.
          # Other types (dmg, deb, rpm, AppImage, msi, NSIS *-setup.exe) are
          # single files copied verbatim.
          BUNDLE="$REL/bundle"
          if [[ -d "$BUNDLE" ]]; then
            if [[ "${{ matrix.platform }}" == darwin-* && -d "$BUNDLE/macos" ]]; then
              case "${{ matrix.platform }}" in
                darwin-arm64) APP_ARCH="aarch64" ;;
                darwin-x64) APP_ARCH="x64" ;;
                *) echo "Unsupported macOS overlay platform: ${{ matrix.platform }}" >&2; exit 1 ;;
              esac
              APP_ARCHIVE="OpenCorvus_${{ needs.prepare.outputs.version }}_${APP_ARCH}.app.tar.gz"
              for app in "$BUNDLE/macos"/*.app; do
                [[ -d "$app" ]] || continue
                tar -czf "$OUT/$APP_ARCHIVE" -C "$BUNDLE/macos" "$(basename "$app")"
              done
            fi
            find "$BUNDLE" -type f \
              \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \) \
              -exec cp {} "$OUT/" \;
          fi

      - name: Validate overlay assets
        run: |
          EXTRA=""
          if [[ "${{ needs.prepare.outputs.release }}" == "1" ]]; then
            EXTRA="--require-bundle"
          fi
          bun ./script/check-release-assets.ts overlay \
            --dir packages/overlay/dist-artifacts/${{ matrix.platform }} \
            --platform "${{ matrix.platform }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            $EXTRA

      - name: Upload overlay artifact
        uses: actions/upload-artifact@v7
        with:
          name: overlay-${{ matrix.platform }}
          path: packages/overlay/dist-artifacts/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  publish-release-assets:
    name: publish release assets
    needs:
      - prepare
      - package-cli
      - package-overlay
    if: needs.prepare.outputs.release == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download CLI dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: opencorvus-dist-*
          path: /tmp/release-assets

      - uses: actions/download-artifact@v8
        with:
          pattern: overlay-*
          path: /tmp/release-assets

      - name: Upload release assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          UPLOAD_DIR="$(mktemp -d)"
          bun ./script/stage-release-upload-assets.ts --source /tmp/release-assets --out "$UPLOAD_DIR" --version "$VERSION"
          mapfile -t FILES < <(find "$UPLOAD_DIR" -type f | sort)
          printf '%s\n' "${FILES[@]}"
          gh release upload "v${VERSION}" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  publish-release-branch:
    name: publish release branch
    needs:
      - prepare
      - package-cli
      - package-overlay
    if: needs.prepare.outputs.release == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download CLI dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: opencorvus-dist-*
          path: /tmp/dist
          merge-multiple: true

      - name: Download overlay artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: overlay-*
          path: /tmp/overlay

      - name: Assemble and push release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"

          WORK=$(mktemp -d)
          cd "$WORK"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch --depth=1 origin refs/heads/release:refs/remotes/origin/release 2>/dev/null; then
            RELEASE_LEASE="$(git rev-parse refs/remotes/origin/release)"
            git checkout release
          else
            RELEASE_LEASE=""
            git checkout --orphan release
          fi

          mapfile -d '' TRACKED_FILES < <(git ls-files -z)
          if (( ${#TRACKED_FILES[@]} > 0 )); then
            git rm -f -- "${TRACKED_FILES[@]}"
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +

          for required_doc in README.md RELEASE.md; do
            if [[ ! -f "$GITHUB_WORKSPACE/$required_doc" ]]; then
              echo "Missing release branch document: $required_doc" >&2
              exit 1
            fi
            cp "$GITHUB_WORKSPACE/$required_doc" .
          done

          shopt -s nullglob
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            src="/tmp/dist/opencorvus-${platform}"
            [[ -d "$src" ]] || continue
            mkdir -p "$platform"
            cp -R "$src"/. "$platform/"
            find "$platform" -type f -name '*.map' -delete
            opencorvus_binaries=("$platform"/opencorvus*)
            if (( ${#opencorvus_binaries[@]} == 0 )); then
              echo "Missing OpenCorvus binary in release branch platform directory: $platform" >&2
              exit 1
            fi
            chmod +x "${opencorvus_binaries[@]}"
            rg_binaries=("$platform"/bin/rg*)
            if (( ${#rg_binaries[@]} == 0 )); then
              echo "Missing ripgrep binary in release branch platform directory: $platform" >&2
              exit 1
            fi
            chmod +x "${rg_binaries[@]}"
          done

          mkdir -p overlay
          overlay_dirs=(/tmp/overlay/overlay-*)
          if (( ${#overlay_dirs[@]} == 0 )); then
            echo "No overlay artifacts found under /tmp/overlay" >&2
            exit 1
          fi
          cp -R "${overlay_dirs[@]}" overlay/

          git add -A
          if git diff --cached --quiet; then
            echo "release branch already up to date for v${VERSION}"
          else
            git commit -m "release: v${VERSION}"
          fi
          git push origin release:release --force-with-lease=refs/heads/release:"${RELEASE_LEASE}"
