<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="tokens.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100%;
        padding: 10px;
      }

      #card {
        width: 100%;
        height: 100%;
        border: 1px solid rgba(21, 52, 95, 0.2);
        border-radius: 14px;
        background:
          radial-gradient(circle at 100% 0%, rgba(56, 189, 248, 0.2), rgba(56, 189, 248, 0) 42%),
          radial-gradient(circle at 0% 100%, rgba(34, 197, 94, 0.14), rgba(34, 197, 94, 0) 38%), var(--glass);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        gap: 7px;
        box-shadow:
          var(--shadow-lg),
          0 0 18px rgba(46, 162, 255, 0.14);
        padding: 12px 14px;
        overflow: hidden;
        position: relative;
      }

      #card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        mask:
          linear-gradient(#000, #000) content-box,
          linear-gradient(#000, #000);
        mask-composite: exclude;
        padding: 1px;
        opacity: 0.45;
      }

      #head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 22px;
        border-radius: var(--radius-pill);
        padding: 2px 10px;
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
        border: 1px solid rgba(22, 57, 102, 0.2);
        background: rgba(255, 255, 255, 0.74);
      }

      #source {
        color: var(--text-secondary);
        max-width: 48%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #risk {
        color: #0e7490;
        background: rgba(6, 182, 212, 0.14);
        border-color: rgba(6, 182, 212, 0.38);
      }

      #card[data-risk="low"] #risk {
        color: #047857;
        background: rgba(16, 185, 129, 0.14);
        border-color: rgba(16, 185, 129, 0.38);
      }

      #card[data-risk="high"] #risk {
        color: #b91c1c;
        background: rgba(239, 68, 68, 0.14);
        border-color: rgba(239, 68, 68, 0.38);
      }

      #title {
        font-family: var(--font-ui);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }

      #msg {
        font-family: var(--font-ui);
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.35;
        max-height: 56px;
        overflow: auto;
        white-space: pre-wrap;
      }

      #meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-family: var(--font-ui);
        font-size: 11px;
        color: var(--text-muted);
      }

      #target {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #timer-wrap {
        position: relative;
        width: 100%;
        height: 4px;
        border-radius: var(--radius-pill);
        overflow: hidden;
        background: rgba(28, 76, 144, 0.12);
        border: 1px solid rgba(28, 76, 144, 0.18);
      }

      #timer-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #22c55e);
        transition: width 120ms linear;
      }

      #details-toggle {
        align-self: flex-start;
        border: 0;
        background: transparent;
        color: rgba(20, 50, 94, 0.82);
        font-family: var(--font-ui);
        font-size: 12px;
        font-weight: 600;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: rgba(20, 50, 94, 0.32);
        text-underline-offset: 2px;
      }

      #details-toggle:hover {
        color: var(--text-primary);
        text-decoration-color: rgba(20, 50, 94, 0.6);
      }

      #details {
        border: 1px solid rgba(21, 52, 95, 0.14);
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.72);
        padding: 8px;
        display: grid;
        gap: 6px;
        max-height: 92px;
        overflow: auto;
      }

      .row {
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 6px;
        align-items: start;
        font-family: var(--font-ui);
        font-size: 11px;
        color: var(--text-muted);
      }

      .row > code {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-secondary);
        white-space: pre-wrap;
        word-break: break-word;
      }

      #open-console {
        justify-self: flex-start;
        border: 1px solid rgba(21, 52, 95, 0.2);
        background: rgba(255, 255, 255, 0.84);
        color: var(--text-secondary);
        border-radius: var(--radius-sm);
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
        padding: 7px 10px;
        cursor: pointer;
      }

      #open-console:hover {
        border-color: rgba(21, 52, 95, 0.36);
        color: var(--text-primary);
      }

      #remember-wrap {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        font-family: var(--font-ui);
        font-size: 11px;
        color: var(--text-muted);
        line-height: 1.35;
        user-select: none;
      }

      #remember {
        margin-top: 1px;
        accent-color: #0ea5e9;
      }

      #actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        margin-top: auto;
        padding-top: 2px;
      }

      button {
        border: 1px solid var(--glass-border);
        background: rgba(20, 50, 94, 0.04);
        color: var(--text-primary);
        border-radius: var(--radius-sm);
        font-family: var(--font-ui);
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        padding: 9px 12px;
        min-height: 34px;
        min-width: 102px;
        cursor: pointer;
        transition:
          background 120ms var(--ease),
          border-color 120ms var(--ease),
          box-shadow 120ms var(--ease),
          color 120ms var(--ease);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      button:focus-visible {
        outline: 2px solid rgba(14, 165, 233, 0.58);
        outline-offset: 1px;
      }

      kbd {
        border: 1px solid rgba(21, 52, 95, 0.22);
        background: rgba(255, 255, 255, 0.8);
        border-radius: 4px;
        min-width: 20px;
        padding: 1px 5px;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
      }

      #ok {
        background: linear-gradient(135deg, rgba(3, 105, 161, 0.9), rgba(2, 132, 199, 0.92));
        border-color: rgba(3, 105, 161, 0.85);
        color: rgba(245, 251, 255, 0.98);
        box-shadow: 0 6px 16px rgba(3, 105, 161, 0.24);
      }

      #ok:hover {
        background: linear-gradient(135deg, rgba(2, 132, 199, 0.95), rgba(14, 165, 233, 0.95));
        border-color: rgba(2, 132, 199, 0.94);
        box-shadow: 0 8px 18px rgba(3, 105, 161, 0.28);
      }

      #ok kbd {
        color: rgba(236, 247, 255, 0.92);
        border-color: rgba(236, 247, 255, 0.36);
        background: rgba(255, 255, 255, 0.12);
      }

      #cancel {
        color: var(--text-secondary);
        border-color: rgba(21, 52, 95, 0.22);
        background: rgba(255, 255, 255, 0.84);
      }

      #cancel:hover {
        color: #991b1b;
        border-color: rgba(239, 68, 68, 0.4);
        background: rgba(239, 68, 68, 0.08);
      }

      @media (max-width: 500px) {
        #actions {
          gap: 6px;
        }

        button {
          min-width: 92px;
          padding: 8px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="card" data-risk="medium">
        <div id="head">
          <span id="risk" class="chip">Medium risk</span>
          <span id="source" class="chip">From OpenCorvus</span>
        </div>
        <div id="title">Confirm next step</div>
        <div id="msg">Continue?</div>
        <div id="meta">
          <span id="target">Target: unknown</span>
          <span id="timer-label" hidden>Timeout in 30.0s</span>
        </div>
        <div id="timer-wrap" hidden>
          <div id="timer-fill"></div>
        </div>
        <button id="details-toggle" type="button" aria-expanded="false">Show details</button>
        <div id="details" hidden>
          <div class="row"><span>Request</span><code id="detail-id">-</code></div>
          <div class="row"><span>Buttons</span><code id="detail-buttons">Confirm / Cancel</code></div>
          <div class="row"><span>Timeout</span><code id="detail-timeout">none</code></div>
          <div class="row"><span>Message</span><code id="detail-message">Continue?</code></div>
          <button id="open-console" type="button">Open console</button>
        </div>
        <label id="remember-wrap" for="remember">
          <input id="remember" type="checkbox" />
          <span id="remember-text">Remember this decision for this exact request in this session.</span>
        </label>
        <div id="actions">
          <button id="cancel" type="button">
            <span id="cancel-text">Reject</span>
            <kbd>Esc</kbd>
          </button>
          <button id="ok" type="button">
            <span id="ok-text">Allow once</span>
            <kbd>Enter</kbd>
          </button>
        </div>
      </div>
    </div>
    <script src="protocol.js"></script>
    <script src="tauri-bridge.js"></script>
    <script src="confirm.js"></script>
  </body>
</html>
