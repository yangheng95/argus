name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3). Leave empty for dev snapshot (no release).'
        required: false
        default: ''

jobs:
  package:
    name: package (all platforms)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.meta.outputs.release }}
      version: ${{ steps.meta.outputs.version }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Fetch models.dev snapshot
        run: curl -fsSL https://models.dev/api.json | tr -d '\n\r' > /tmp/models-api-clean.json

      - name: Cache Bun cross-compilation runtimes
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-runtimes-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-runtimes-${{ runner.os }}-

      - name: Pre-cache Bun cross-compilation runtimes
        run: |
          echo 'console.log(1)' > /tmp/_warmup.ts
          for target in \
            bun-linux-aarch64 bun-linux-x64 bun-linux-x64-baseline \
            bun-linux-aarch64-musl bun-linux-x64-musl \
            bun-darwin-aarch64 bun-darwin-x64 bun-darwin-x64-baseline \
            bun-windows-x64 bun-windows-x64-baseline; do
            bun build --compile --target=$target /tmp/_warmup.ts --outfile /tmp/_warmup_out 2>/dev/null || true
          done
          rm -f /tmp/_warmup.ts /tmp/_warmup_out*

      - name: Resolve version and release flag
        id: meta
        run: |
          # tag push: use tag name
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=1
          # workflow_dispatch with version input
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            RELEASE=1
          else
            VERSION=""
            RELEASE=0
          fi
          echo "version=$VERSION"    >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE"    >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.meta.outputs.release == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" || true

      - name: Build all platforms
        working-directory: packages/opencorvus
        env:
          MODELS_DEV_API_JSON: /tmp/models-api-clean.json
          OPENCORVUS_RELEASE:  ${{ steps.meta.outputs.release == '1' && '1' || '' }}
          OPENCORVUS_VERSION:  ${{ steps.meta.outputs.version }}
          OPENCORVUS_CHANNEL:  ${{ steps.meta.outputs.release == '1' && 'latest' || '' }}
          GH_REPO:           ${{ github.repository }}
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
        run: bun run script/build.ts --all

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencorvus-dist
          path: packages/opencorvus/dist/
          retention-days: 7

  publish:
    name: publish release branch
    needs: package
    if: needs.package.outputs.release == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: opencorvus-dist
          path: /tmp/dist

      - name: Assemble and push release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION:  ${{ needs.package.outputs.version }}
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"

          # Prepare a clean worktree for the release branch
          WORK=$(mktemp -d)
          cd "$WORK"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Reuse existing history if branch exists; otherwise start orphan
          if git fetch origin release --depth=1 2>/dev/null; then
            git checkout release
          else
            git checkout --orphan release
          fi

          # Wipe everything, start fresh
          git rm -rf . 2>/dev/null || true

          # README from source repo
          cp "$GITHUB_WORKSPACE/README.md" . 2>/dev/null || echo "# OpenCorvus v${VERSION}" > README.md

          # Primary platform binaries (skip baseline / musl variants)
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            src="/tmp/dist/opencorvus-${platform}/bin"
            [[ -d "$src" ]] || continue
            mkdir -p "$platform"
            # copy binaries, skip sourcemaps
            find "$src" -maxdepth 1 -type f ! -name '*.map' -exec cp {} "$platform/" \;
            chmod +x "$platform"/opencorvus* 2>/dev/null || true
          done

          echo "── Release branch contents ──────────────────────"
          find . -not -path './.git/*' | sort
          echo "─────────────────────────────────────────────────"

          git add -A
          git commit -m "release: v${VERSION}"
          git push origin release --force
