<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --accent: rgba(110, 168, 254, 0.9);
      --accent-glow: rgba(110, 168, 254, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      background: transparent;
    }

    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* ── Focus ring: crosshair at target point ── */
    #focus {
      position: absolute;
      left: 50%;
      top: 75%;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%) scale(0.6);
      border-radius: 999px;
      border: 2.5px solid var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
      opacity: 0;
      transition: opacity 100ms ease, transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #focus::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--accent);
    }

    #focus::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      opacity: 0;
    }

    #focus.pointer.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #focus.pointer.visible::after {
      animation: ring-pulse 500ms ease-out;
    }

    #focus.done {
      border-color: rgba(52, 211, 153, 0.95);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.3);
    }

    #focus.done::before {
      background: rgba(52, 211, 153, 0.95);
    }

    /* ── Popup label: compact pill above focus ── */
    #popup {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%) translateY(3px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(15, 17, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      color: rgba(240, 244, 255, 0.92);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.02em;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    #popup.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #popup.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-3px);
      transition: opacity 200ms ease, transform 200ms ease;
    }

    #popup.done {
      --accent: rgba(52, 211, 153, 0.95);
      border-color: rgba(52, 211, 153, 0.2);
    }

    /* Action-specific accent colors */
    #popup[data-action="click"],
    #popup[data-action="double"],
    #popup[data-action="right"],
    #popup[data-action="middle"] { --accent: rgba(96, 165, 250, 0.94); }
    #popup[data-action="type"]   { --accent: rgba(52, 211, 153, 0.94); }
    #popup[data-action="key"]    { --accent: rgba(251, 191, 36, 0.94); }
    #popup[data-action="scroll"] { --accent: rgba(167, 139, 250, 0.94); }
    #popup[data-action="drag"]   { --accent: rgba(248, 113, 113, 0.94); }
    #popup[data-action="move"]   { --accent: rgba(129, 140, 248, 0.9); }

    /* Accent dot before icon */
    #popup::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      flex-shrink: 0;
    }

    #icon {
      width: 14px;
      height: 14px;
      color: rgba(240, 244, 255, 0.8);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    #icon svg {
      width: 100%;
      height: 100%;
    }

    #label {
      color: rgba(240, 244, 255, 0.7);
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    @keyframes ring-pulse {
      from {
        opacity: 0.7;
        transform: scale(0.85);
      }
      to {
        opacity: 0;
        transform: scale(1.4);
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="focus"></div>
    <div id="popup">
      <span id="icon"></span>
      <span id="label"></span>
    </div>
  </div>
  <script src="tauri-bridge.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
