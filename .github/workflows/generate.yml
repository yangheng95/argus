name: generate

on:
  push:
    branches:
      - dev

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      APP_ID: ${{ vars.OPENCORVUS_APP_ID }}
      APP_SECRET: ${{ secrets.OPENCORVUS_APP_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup git committer
        if: ${{ env.APP_ID != '' && env.APP_SECRET != '' }}
        uses: ./.github/actions/setup-git-committer
        with:
          opencorvus-app-id: ${{ env.APP_ID }}
          opencorvus-app-secret: ${{ env.APP_SECRET }}

      - name: Configure git identity
        if: ${{ !(env.APP_ID != '' && env.APP_SECRET != '') }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate
        run: ./script/generate.ts

      - name: Commit and push
        run: |
          mapfile -t GENERATED_PATHS < <(bun ./script/generated-artifacts.ts --print)
          bun ./script/generated-artifacts.ts --check-worktree
          git add -A -- "${GENERATED_PATHS[@]}"
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: generate"
          git push origin HEAD:${{ github.ref_name }}
