<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
      padding: 12px;
    }

    #card {
      width: 100%;
      height: 100%;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      color: var(--text-primary);
      display: grid;
      grid-template-rows: auto 1fr auto;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      overflow: hidden;
    }

    /* ── Top gradient accent bar ── */
    #card::before {
      content: "";
      display: block;
      height: 2px;
      background: var(--brand-gradient);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    #title {
      padding: 14px 18px 4px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    #msg {
      padding: 6px 18px 12px;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      overflow: auto;
      white-space: pre-wrap;
    }

    #actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px 14px;
      border-top: 1px solid rgba(20, 50, 94, 0.1);
    }

    button {
      border: 1px solid var(--glass-border);
      background: rgba(20, 50, 94, 0.04);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      padding: 9px 16px;
      cursor: pointer;
      transition:
        background 120ms var(--ease),
        border-color 120ms var(--ease),
        box-shadow 120ms var(--ease);
    }

    button:hover {
      background: rgba(20, 50, 94, 0.08);
      border-color: var(--glass-border-hover);
    }

    #ok {
      background: linear-gradient(135deg, rgba(var(--color-done-tint-rgb), 0.15), rgba(var(--brand-to-rgb), 0.1));
      border-color: rgba(var(--color-done-tint-rgb), 0.3);
      color: var(--color-done);
    }

    #ok:hover {
      background: linear-gradient(135deg, rgba(var(--color-done-tint-rgb), 0.25), rgba(var(--brand-to-rgb), 0.18));
      border-color: rgba(var(--color-done-tint-rgb), 0.45);
      box-shadow: 0 0 12px rgba(var(--color-done-tint-rgb), 0.1);
    }

    #cancel {
      color: var(--text-secondary);
    }

    #cancel:hover {
      color: var(--color-error);
      border-color: rgba(var(--color-error-tint-rgb), 0.25);
      background: rgba(var(--color-error-tint-rgb), 0.06);
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="card">
      <div id="title">Confirm Next Step</div>
      <div id="msg">Continue?</div>
      <div id="actions">
        <button id="cancel">Cancel</button>
        <button id="ok">Confirm</button>
      </div>
    </div>
  </div>
  <script src="protocol.js"></script>
  <script src="tauri-bridge.js"></script>
  <script src="confirm.js"></script>
</body>
</html>
