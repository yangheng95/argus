<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --accent: var(--color-click);
      --accent-glow: rgba(99, 102, 241, 0.25);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      background: transparent;
    }

    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* ── Focus ring ── */
    #focus {
      position: absolute;
      left: 50%;
      top: 75%;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%) scale(0.5);
      border-radius: var(--radius-pill);
      border: 2px solid transparent;
      background:
        linear-gradient(var(--surface-0), var(--surface-0)) padding-box,
        linear-gradient(135deg, var(--accent), rgba(255, 255, 255, 0.2)) border-box;
      opacity: 0;
      transition: opacity 120ms var(--ease), transform 200ms var(--ease-bounce);
    }

    #focus::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    #focus::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: inherit;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      opacity: 0;
    }

    #focus.pointer.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #focus.pointer.visible::after {
      animation: ring-pulse 600ms var(--ease) forwards;
    }

    #focus.done {
      background:
        linear-gradient(var(--surface-0), var(--surface-0)) padding-box,
        linear-gradient(135deg, var(--color-done), rgba(255, 255, 255, 0.15)) border-box;
    }

    #focus.done::before {
      background: var(--color-done);
      box-shadow: 0 0 8px var(--color-done);
    }

    /* ── Popup pill ── */
    #popup {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%) translateY(4px);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.01em;
      white-space: nowrap;
      opacity: 0;
      box-shadow: var(--shadow-md), 0 0 0 0 transparent;
      transition:
        opacity 140ms var(--ease),
        transform 140ms var(--ease),
        box-shadow 200ms var(--ease);
    }

    #popup.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      box-shadow: var(--shadow-md), 0 0 24px rgba(99, 102, 241, 0.08);
    }

    #popup.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-4px);
      transition: opacity 220ms var(--ease), transform 220ms var(--ease);
    }

    #popup.done {
      --accent: var(--color-done);
      border-color: rgba(52, 211, 153, 0.18);
      box-shadow: var(--shadow-md), 0 0 20px rgba(52, 211, 153, 0.1);
    }

    /* ── Action accent colors ── */
    #popup[data-action="click"],
    #popup[data-action="double"],
    #popup[data-action="right"],
    #popup[data-action="middle"] { --accent: var(--color-click); }
    #popup[data-action="type"]   { --accent: var(--color-type); }
    #popup[data-action="key"]    { --accent: var(--color-key); }
    #popup[data-action="scroll"] { --accent: var(--color-scroll); }
    #popup[data-action="drag"]   { --accent: var(--color-drag); }
    #popup[data-action="move"]   { --accent: var(--color-move); }

    /* ── Accent indicator bar (left edge) ── */
    #popup::before {
      content: "";
      width: 3px;
      height: 14px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      flex-shrink: 0;
      transition: background 120ms var(--ease), box-shadow 120ms var(--ease);
    }

    #icon {
      width: 14px;
      height: 14px;
      color: var(--text-primary);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      opacity: 0.85;
    }

    #icon svg {
      width: 100%;
      height: 100%;
    }

    #label {
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    @keyframes ring-pulse {
      0% {
        opacity: 0.6;
        transform: scale(0.9);
      }
      100% {
        opacity: 0;
        transform: scale(1.6);
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="focus"></div>
    <div id="popup">
      <span id="icon"></span>
      <span id="label"></span>
    </div>
  </div>
  <script src="tauri-bridge.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
