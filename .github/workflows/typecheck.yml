name: typecheck

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Enforce SDK v2 imports
        run: bun run check:sdk-imports

      - name: Verify generated SDK and OpenAPI
        run: |
          bun ./packages/sdk/js/script/build.ts
          bun --cwd packages/opencorvus dev generate > /tmp/openapi.generated.json
          diff -u /tmp/openapi.generated.json packages/sdk/openapi.json
          git diff --exit-code -- packages/sdk/js/src/gen packages/sdk/openapi.json

      - name: Run typecheck
        run: bunx turbo run typecheck
