<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      background: transparent;
    }

    #root {
      position: absolute;
      inset: 0;
      padding: 2px;
    }

    #frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      border: 4px solid rgba(56, 189, 248, 0.95);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.28), 0 0 42px rgba(56, 189, 248, 0.55);
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    #frame.visible {
      opacity: 1;
      transform: scale(1);
    }

    #frame::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 16px;
      border: 2px solid rgba(125, 211, 252, 0.4);
      opacity: 0;
    }

    #frame.visible::after {
      animation: pulse 560ms ease-out;
    }

    #label {
      position: absolute;
      top: 8px;
      left: 10px;
      max-width: calc(100% - 20px);
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(125, 211, 252, 0.4);
      background: rgba(8, 17, 32, 0.86);
      color: rgba(240, 249, 255, 0.96);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    @keyframes pulse {
      from {
        opacity: 0.9;
        transform: scale(0.94);
      }
      to {
        opacity: 0;
        transform: scale(1.04);
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="frame">
      <div id="label">OpenCorvus target window</div>
    </div>
  </div>
  <script src="tauri-bridge.js"></script>
  <script src="window-highlight.js"></script>
</body>
</html>
