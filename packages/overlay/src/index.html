<!DOCTYPE html>
<html lang="en-US" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCorvus</title>
  <!-- OPENCORVUS_OVERLAY_SIZE_CONTRACT -->
  <link rel="stylesheet" href="styles/tokens/design-language.css">
  <link rel="stylesheet" href="styles/cascade/base.css">
  <link rel="stylesheet" href="styles/cascade/dark.css">
  <link rel="stylesheet" href="styles/cascade/vscode-dark.css">
  <link rel="stylesheet" href="styles/cascade/light.css">
  <link rel="stylesheet" href="styles/cascade/typography.css">
  <link rel="stylesheet" href="styles/primitives/button.css">
  <link rel="stylesheet" href="styles/primitives/badge.css">
  <link rel="stylesheet" href="styles/primitives/tabs.css">
  <link rel="stylesheet" href="styles/primitives/panel.css">
  <link rel="stylesheet" href="styles/primitives/section.css">
  <link rel="stylesheet" href="styles/surfaces/titlebar.css">
  <link rel="stylesheet" href="styles/surfaces/composer.css">
  <link rel="stylesheet" href="styles/surfaces/conversation.css">
  <link rel="stylesheet" href="styles/surfaces/sidebar.css">
  <link rel="stylesheet" href="styles/surfaces/activity.css">
  <link rel="stylesheet" href="styles/surfaces/inspector.css">
  <link rel="stylesheet" href="styles/surfaces/settings.css">
  <link rel="stylesheet" href="styles/surfaces/workspace.css">
  <link rel="stylesheet" href="styles/surfaces/markdown.css">
  <link rel="stylesheet" href="styles/surfaces/messages.css">
  <link rel="stylesheet" href="styles/surfaces/diff.css">
  <link rel="stylesheet" href="styles/surfaces/changes.css">
  <link rel="stylesheet" href="styles/surfaces/field.css">
  <link rel="stylesheet" href="styles/surfaces/dialog.css">
  <link rel="stylesheet" href="styles/surfaces/workspace-onboarding.css">
  <link rel="stylesheet" href="styles/surfaces/cmdk.css">
  <link rel="stylesheet" href="styles/surfaces/conn-banner.css">
  <link rel="stylesheet" href="styles/surfaces/notifications.css">
  <link rel="stylesheet" href="styles/surfaces/empty-state.css">
  <link rel="stylesheet" href="styles/surfaces/inline-pill.css">
  <link rel="stylesheet" href="styles/surfaces/header.css">
  <link rel="stylesheet" href="styles/surfaces/card.css">
  <link rel="stylesheet" href="styles/surfaces/chat-bubble.css">
  <link rel="stylesheet" href="styles/surfaces/mission.css">
  <link rel="stylesheet" href="styles/surfaces/coding-assistant.css">
  <link rel="stylesheet" href="styles/surfaces/work-ledger.css">
</head>
<body data-page="overlay" data-theme="light">
  <!-- Titlebar (draggable) -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-left" data-tauri-drag-region>
      <div class="titlebar-brand">
        <div id="solidTitlebarBrandGuide"></div>
      </div>
      <div id="solidTitlebarMenu"></div>
    </div>
    <div class="titlebar-spacer" data-tauri-drag-region></div>
    <div class="titlebar-utility">
      <span id="solidConnBadge"></span>
      <div class="titlebar-actions" data-no-drag="true">
        <div id="solidWindowControls"></div>
      </div>
    </div>
  </header>

  <!-- Main Panel -->
  <main class="panel">

    <!-- Horizontal body: unified work ledger left, workflow and right-toolbar views center -->
    <div class="panel-body" id="panelBody">
      <div class="left-activity-shell" id="leftActivityShell">
        <aside class="sidebar" id="sidebar" data-collapsed="false">
        <div class="side-panel-content sidebar-content">
          <div class="sidebar-header oc-surface-header">
            <div class="sidebar-title oc-surface-header__title" id="leftPanelTitle" data-i18n="work_ledger.title">Work</div>
          </div>

          <div class="side-activity-body sidebar-activity-body" id="leftPanelWork" data-side-activity="work" data-active="true">
            <div class="sidebar-body">
              <div class="sidebar-list session-list-panel work-ledger-panel" id="workLedgerPanel"></div>
            </div>
          </div>

          <footer class="sidebar-footer" aria-label="Author">
            <span class="chat-version">
              <span id="solidChatVersion"></span>
            </span>
          </footer>
        </div>
        </aside>
      </div>
      <div class="pane-resizer pane-resizer-left" id="leftPaneResizer" role="separator" aria-orientation="vertical" aria-label="Resize left panel" aria-controls="sidebar workspaceMain" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0"></div>

      <div class="workspace-main" id="workspaceMain">
      <div class="conversation-workspace" id="conversationWorkspace">

      <section class="center-workbench" id="centerWorkbench" data-open="false">
        <div class="center-workbench-body">
          <div class="center-workbench-view" id="centerWorkbenchWorkflow" data-workbench-view="workflow" data-open="true" data-active="true">
            <div class="center-workbench-activity chat-workflow-activity">
              <section class="chat" id="chatSection">
                <div
                  class="task-switch-progress"
                  id="taskSwitchProgress"
                  aria-label="Loading task"
                  aria-busy="false"
                  data-active="false"
                ></div>
                <header class="chat-header oc-surface-header">
                  <div class="chat-header-main oc-surface-header__main">
                    <span class="chat-title oc-surface-header__title" id="chatViewTitle" data-i18n="chat.title">Workflow</span>
                  </div>
                  <div class="chat-header-status" id="solidTaskStatusMount"></div>
                  <div class="chat-header-meta oc-surface-header__actions">
                    <span
                      class="chat-usage"
                      id="chatUsage"
                      data-i18n-title="chat.usage_tooltip"
                      data-i18n-aria-label="chat.usage_aria"
                    ></span>
                  </div>
                </header>
                <div class="chat-content-frame" id="chatContentFrame">
                  <div class="chat-message-pane" id="chatMessagePane">
                    <div class="conversation-body" id="conversationBody">
                      <div class="conversation-scroll-shell">
                        <div class="chat-scroll session-content" id="chatScroll"></div>
                      </div>
                    </div>
                    <div id="solidConversationAgentRailMount" class="conversation-agent-rail-host"></div>
                  </div>
                </div>
                <div id="solidChatComposer"></div>
              </section>
            </div>
          </div>
          <div class="center-workbench-panel-separator" id="centerWorkbenchSeparatorWorkflow" data-center-workbench-separator="workflow" role="separator" aria-orientation="vertical" aria-label="Resize center workbench panels" tabindex="-1" hidden></div>
          <div class="center-workbench-view" id="centerWorkbenchExplorer" data-workbench-view="explorer" data-open="false" data-active="false">
            <div id="solidFileExplorerMount" class="center-workbench-activity sidebar-explorer-panel"></div>
          </div>
          <div class="center-workbench-panel-separator" id="centerWorkbenchSeparatorExplorer" data-center-workbench-separator="explorer" role="separator" aria-orientation="vertical" aria-label="Resize center workbench panels" tabindex="-1" hidden></div>
          <div class="center-workbench-view" id="centerWorkbenchDiff" data-workbench-view="diff" data-open="false" data-active="false">
            <div id="solidFileChangesMount" class="center-workbench-activity sidebar-file-changes-panel"></div>
          </div>
          <div class="center-workbench-panel-separator" id="centerWorkbenchSeparatorDiff" data-center-workbench-separator="diff" role="separator" aria-orientation="vertical" aria-label="Resize center workbench panels" tabindex="-1" hidden></div>
          <div class="center-workbench-view" id="centerWorkbenchBrowser" data-workbench-view="browser" data-open="false" data-active="false">
            <div id="solidBrowserPreviewMount" class="center-workbench-activity chat-browser-preview-activity"></div>
          </div>
          <div class="center-workbench-panel-separator" id="centerWorkbenchSeparatorBrowser" data-center-workbench-separator="browser" role="separator" aria-orientation="vertical" aria-label="Resize center workbench panels" tabindex="-1" hidden></div>
          <div class="center-workbench-view" id="centerWorkbenchScreenshots" data-workbench-view="screenshots" data-open="false" data-active="false">
            <div id="solidScreenshotBrowserMount" class="center-workbench-activity screenshot-browser-activity"></div>
          </div>
          <div class="center-workbench-panel-separator" id="centerWorkbenchSeparatorScreenshots" data-center-workbench-separator="screenshots" role="separator" aria-orientation="vertical" aria-label="Resize center workbench panels" tabindex="-1" hidden></div>
          <div class="center-workbench-view" id="centerWorkbenchRequirements" data-workbench-view="requirements" data-open="false" data-active="false">
            <div id="solidRequirementsPanelMount" class="center-workbench-activity task-scope-activity"></div>
          </div>
          <div class="center-workbench-panel-separator" id="centerWorkbenchSeparatorRequirements" data-center-workbench-separator="requirements" role="separator" aria-orientation="vertical" aria-label="Resize center workbench panels" tabindex="-1" hidden></div>
          <div class="center-workbench-view" id="centerWorkbenchArchitect" data-workbench-view="architect" data-open="false" data-active="false">
            <div id="solidArchitectPanelMount" class="center-workbench-activity task-scope-activity"></div>
          </div>
          <div class="center-workbench-panel-separator" id="centerWorkbenchSeparatorArchitect" data-center-workbench-separator="architect" role="separator" aria-orientation="vertical" aria-label="Resize center workbench panels" tabindex="-1" hidden></div>
          <div class="center-workbench-view" id="centerWorkbenchGoals" data-workbench-view="goals" data-open="false" data-active="false">
            <div id="solidGoalsPanelMount" class="center-workbench-activity task-scope-activity"></div>
          </div>
          <div class="center-workbench-panel-separator" id="centerWorkbenchSeparatorGoals" data-center-workbench-separator="goals" role="separator" aria-orientation="vertical" aria-label="Resize center workbench panels" tabindex="-1" hidden></div>
          <div class="center-workbench-view" id="centerWorkbenchNotifications" data-workbench-view="notifications" data-open="false" data-active="false">
            <div class="center-workbench-activity sections" id="notificationSections" data-right-activity="notifications">
              <div class="side-panel-content sections-content">
                <header class="sections-header oc-surface-header">
                  <div class="sections-title oc-surface-header__title" id="notificationPanelTitle" data-i18n="notify.center_label">Notifications</div>
                </header>
                <div class="right-activity-body" id="rightPanelNotifications" data-side-activity="notifications" data-active="false">
                  <div id="solidNotificationCenterMount" class="notification-center-panel"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="center-workbench-panel-separator" id="centerWorkbenchSeparatorNotifications" data-center-workbench-separator="notifications" role="separator" aria-orientation="vertical" aria-label="Resize center workbench panels" tabindex="-1" hidden></div>
          <div class="center-workbench-view" id="centerWorkbenchFile" data-workbench-view="file" data-open="false" data-active="false">
            <div id="solidFileEditorMount" class="center-workbench-activity chat-file-editor-activity file-editor-mount"></div>
          </div>
        </div>
      </section>
      </div>
      <div id="solidRightActivityToolbar" class="side-activity-toolbar-mount" data-i18n-aria-label="activity.right"></div>

    </div>

  </main>

  <!-- Goal / Session / App / Config dialogs are mounted by Solid host components. -->
  <!-- Explorer, diff, preview, and file editor live in the center workbench panels. -->

  <!-- Skill/MCP/Goal/Channel dialogs removed — Phase 4.
       All functionality moved to Solid components:
       - SkillMarketPanel.tsx (inline Add Skill / Add MCP forms)
       - Settings panels (channel editing)
       - Board.tsx (goal management) -->

  <!-- Memory detail/edit dialogs are handled inline by MemoryPanel.tsx. -->

  <!-- Log Viewer Dialog (managed by Solid LogViewer component) -->
  <div id="solidLogViewer"></div>

  <script type="module" src="/main.tsx"></script>
</body>
</html>
